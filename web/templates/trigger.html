{% extends "base.html" %}
{% block titulo %}Trigger de {{ esquema }}.{{ tabla }}{% endblock %}
{% block contenido %}
<section class="tarjeta">
  <h1>Trigger de {{ esquema }}.{{ tabla }}</h1>
  <h2>Función</h2>
  <pre><code>{{ funcion }}</code></pre>
  <h2>Trigger</h2>
  <pre><code>{{ trigger }}</code></pre>
  <p><a class="boton secundario" href="{{ url_for('inicio') }}">Volver al inicio</a></p>
</section>
{% endblock %}
